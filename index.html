<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行纪 · 中国城市旅行攻略生成器</title>
    <meta name="description" content="行纪 — 输入任意中国城市，AI 为你生成一份可执行的深度旅行攻略与精美海报。527 座城市数据库，个性化行程定制。">
    <meta name="theme-color" content="#C8553D">

    <!-- 安全修复 P1：CSP meta 兜底（即使部署时漏配服务器头也有浏览器层防护） -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' https://html2canvas.hertzen.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="行纪">

    <!-- 字体：衬线展示 + 无衬线正文 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- 海报导出（安全修复 P0：添加 SRI 完整性校验，CDN 被劫持时浏览器拒绝执行） -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"
            integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H"
            crossorigin="anonymous"
            defer></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="site-header" id="siteHeader">
        <div class="wrap nav-inner">
            <a href="#" class="brand" id="brandHome">
                <span class="brand-mark">行</span>
                <span class="brand-name">行纪<span class="brand-en">XING&nbsp;JI</span></span>
            </a>
            <nav class="nav-links">
                <a href="#ranking" class="nav-link">热门榜单</a>
                <a href="#search" class="nav-link">生成攻略</a>
                <button class="nav-link ghost-btn" id="navFavoritesBtn">我的收藏 <span class="badge" id="navFavCount">0</span></button>
            </nav>
        </div>
    </header>

    <!-- 首页 -->
    <main id="homePage">
        <!-- Hero -->
        <section class="hero" id="search">
            <div class="hero-bg" aria-hidden="true"></div>
            <div class="wrap hero-inner">
                <p class="eyebrow">No.001 — 中国城市旅行手记</p>
                <h1 class="hero-title">为每一座城，<br>写一份<em>值得出发</em>的攻略。</h1>
                <p class="hero-lede">输入城市名，AI 即刻生成行程、美食、住宿、预算与避坑指南，并附一张可下载的旅行海报。</p>

                <form class="search-card" id="searchForm" autocomplete="off" aria-label="旅行攻略生成表单">
                    <div class="search-row">
                        <div class="search-input-wrap">
                            <label for="cityInput" class="sr-only">城市名称</label>
                            <input type="text" id="cityInput" placeholder="输入城市名，如 成都、丽江、敦煌…" autocomplete="off" aria-label="城市名称" aria-describedby="searchSuggestions">
                            <div id="searchSuggestions" class="search-suggestions" hidden role="listbox" aria-label="城市建议"></div>
                        </div>
                        <button type="submit" class="btn-primary" id="generateBtn" aria-label="生成旅行攻略">生成攻略</button>
                    </div>

                    <div class="search-meta">
                        <div class="meta-group">
                            <label class="meta-label" for="originInput">出发地</label>
                            <input type="text" id="originInput" class="input-ghost" placeholder="如 北京" autocomplete="off">
                        </div>
                        <div class="meta-group">
                            <label class="meta-label" for="destinationInput">目的地</label>
                            <input type="text" id="destinationInput" class="input-ghost" placeholder="如 成都" autocomplete="off">
                        </div>
                        <div class="meta-group">
                            <label class="meta-label" for="travelDateInput">出行日期</label>
                            <input type="date" id="travelDateInput" class="input-ghost" placeholder="选择日期">
                        </div>
                        <div class="meta-group">
                            <label class="meta-label" for="travelers">人数</label>
                            <select id="travelers" class="select-ghost">
                                <option value="1">1 人</option>
                                <option value="2" selected>2 人</option>
                                <option value="3">3 人</option>
                                <option value="4">4 人</option>
                                <option value="5">5 人</option>
                                <option value="6+">6+ 人</option>
                            </select>
                        </div>
                        <div class="meta-group">
                            <span class="meta-label">天数</span>
                            <div class="day-pills" id="dayPills" role="group" aria-label="选择旅行天数">
                                <button type="button" class="pill" data-days="1" aria-label="1 天">1</button>
                                <button type="button" class="pill" data-days="2" aria-label="2 天">2</button>
                                <button type="button" class="pill active" data-days="3" aria-label="3 天" aria-pressed="true">3</button>
                                <button type="button" class="pill" data-days="4" aria-label="4 天">4</button>
                                <button type="button" class="pill" data-days="5" aria-label="5 天">5</button>
                                <button type="button" class="pill" data-days="7" aria-label="7 天">7</button>
                            </div>
                        </div>
                        <div class="meta-group">
                            <label class="meta-label" for="travelType">偏好</label>
                            <select id="travelType" class="select-ghost">
                                <option value="balanced">均衡观光</option>
                                <option value="culture">文化深度</option>
                                <option value="foodie">美食探店</option>
                                <option value="nature">自然风光</option>
                                <option value="relaxation">休闲度假</option>
                                <option value="adventure">户外探险</option>
                            </select>
                        </div>
                        <div class="meta-group">
                            <label class="meta-label" for="budgetRange">预算</label>
                            <select id="budgetRange" class="select-ghost">
                                <option value="low">经济</option>
                                <option value="medium" selected>舒适</option>
                                <option value="high">豪华</option>
                            </select>
                        </div>
                    </div>

                    <div class="quick-cities" id="quickCities">
                        <span class="qc-label">热门出发：</span>
                    </div>
                </form>
            </div>
        </section>

        <!-- 排行榜 -->
        <section class="ranking" id="ranking">
            <div class="wrap">
                <div class="section-head">
                    <div>
                        <p class="eyebrow">编辑精选 · 季节热度</p>
                        <h2 class="section-title">本周值得一去的地方</h2>
                    </div>
                    <div class="section-aside">
                        <span class="live-dot"></span><span class="live-text">按季节智能排序</span>
                    </div>
                </div>
                <div class="ranking-grid" id="rankingList"></div>
                <p class="ranking-foot" id="rankingFoot">数据来自 527 座城市数据库 · 按季节与热度智能排序</p>
            </div>
        </section>

        <!-- 浏览历史 -->
        <section class="history" id="historySection" hidden>
            <div class="wrap">
                <div class="section-head">
                    <div>
                        <p class="eyebrow">足迹</p>
                        <h2 class="section-title">最近浏览</h2>
                    </div>
                    <div class="section-aside">
                        <button class="btn-ghost btn-sm" id="clearHistoryBtn" title="清空全部浏览历史">
                            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M3 4h10M6 4V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1M5 4l1 9a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1l1-9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>清空历史
                        </button>
                    </div>
                </div>
                <div class="history-list" id="recentHistoryList"></div>
            </div>
        </section>
    </main>

    <!-- 加载层 -->
    <div class="loading-overlay" id="loading" hidden>
        <div class="loading-card">
            <div class="loading-rotor"></div>
            <p class="loading-title">正在为 <span id="loadingCity">这座城市</span> 规划行程</p>
            <p class="loading-sub" id="loadingSub">AI 正在分析景点、美食与预算…</p>
            <div class="loading-bar"><span id="loadingBar"></span></div>
        </div>
    </div>

    <!-- 攻略结果页 -->
    <section class="result-page" id="resultPage" hidden>
        <div class="wrap">
            <div class="result-topbar">
                <button class="back-btn" id="backBtn">← 返回</button>
                <h2 class="result-title" id="resultTitle">攻略</h2>
                <div class="result-actions">
                    <button class="icon-btn" id="favoriteBtn" title="收藏">收藏</button>
                    <button class="icon-btn" id="copyTextBtn" title="复制文本">复制</button>
                    <button class="icon-btn" id="shareLinkBtn" title="复制攻略链接">分享链接</button>
                    <button class="icon-btn" id="downloadPosterBtn" title="下载海报">下载海报</button>
                    <button class="icon-btn" id="weatherBtn" title="查看目的地天气">查天气</button>
                    <button class="icon-btn" id="regenerateBtn" title="用相同城市换参数重新生成">再次生成</button>
                </div>
            </div>

            <div class="result-grid">
                <!-- 海报 -->
                <aside class="poster-col">
                    <div class="poster-frame">
                        <div class="poster" id="poster"></div>
                    </div>
                    <div class="poster-styles" id="posterStyles">
                        <span class="ps-label">风格</span>
                        <button class="style-pill active" data-style="fresh">清新</button>
                        <button class="style-pill" data-style="vintage">复古</button>
                        <button class="style-pill" data-style="minimal">极简</button>
                        <button class="style-pill" data-style="ink">水墨</button>
                    </div>
                </aside>

                <!-- 攻略正文 -->
                <article class="guide-col">
                    <div id="guideContent" class="guide-content"></div>
                </article>
            </div>
        </div>
    </section>

    <!-- 收藏弹层 -->
    <div class="modal-overlay" id="favoritesModal" hidden>
        <div class="modal favorites-modal">
            <div class="modal-head">
                <h3>我的收藏</h3>
                <button class="modal-close" id="closeFavoritesModal">×</button>
            </div>
            <div class="modal-body">
                <div class="fav-search" id="favSearchWrap" hidden>
                    <input type="text" id="favSearchInput" class="fav-search-input" placeholder="搜索收藏的城市或标题…" autocomplete="off">
                </div>
                <div class="favorites-list" id="favoritesList"></div>
                <div class="empty-state" id="emptyFavorites" hidden>
                    <p>还没有收藏任何城市。</p>
                    <p class="hint">在攻略页点击「收藏」即可保存。</p>
                </div>
                <div class="empty-state" id="emptyFavSearch" hidden>
                    <p>未找到匹配的收藏。</p>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn-ghost" id="clearAllFavorites">清空收藏</button>
                <button class="btn-ghost" id="exportFavorites">导出列表</button>
            </div>
        </div>
    </div>

    <!-- Toast（修复 P2：加 aria-live 让屏幕阅读器播报） -->
    <div class="toast-wrap" id="toastWrap" aria-live="polite" aria-atomic="false"></div>

    <!-- v10.6: 返回顶部按钮 -->
    <button class="back-to-top" id="backToTop" title="返回顶部" aria-label="返回顶部" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4l-8 8h5v8h6v-8h5z" fill="currentColor"/></svg>
    </button>

    <!-- 城市数据库 (527城) 修复 P2：加 defer 避免阻塞首屏解析 -->
    <script src="data/expandedCities.js" defer></script>
    <!-- 主应用 -->
    <script src="app.js" defer></script>

    <!-- PWA: Service Worker 注册（生产环境启用） -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => {
                        console.log('[PWA] Service Worker 已注册:', reg.scope);
                        // 监听更新提示
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // 新版本已就绪，可提示用户刷新
                                    if (window.__toast) {
                                        window.__toast('发现新版本，刷新以更新', { action: '刷新', onAction: () => location.reload() });
                                    }
                                }
                            });
                        });
                    })
                    .catch(err => console.warn('[PWA] SW 注册失败:', err));
            });

            // 监听网络状态
            window.addEventListener('online', () => {
                if (window.__toast) window.__toast('网络已恢复');
            });
            window.addEventListener('offline', () => {
                if (window.__toast) window.__toast('当前处于离线状态，仅可访问已缓存内容', { duration: 4000 });
            });
        }
    </script>
</body>
</html>
