# Render 部署配置（免费 Node.js Web Service）
# 文档: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: travel-guide
    env: node
    region: singapore  # 新加坡区域，国内访问相对较快
    plan: free         # 免费方案（750 小时/月，15 分钟无访问会休眠）
    buildCommand: npm install
    startCommand: node server.js
    rootDir: backend
    # 注意：server.js 通过 path.join(__dirname, '..') 托管根目录的前端静态资源
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # v10.10 修复 P1-14：原值为 "*"。但 server.js 对白名单做精确匹配
      # （allowedOrigins.includes(origin)），"*" 永不命中真实 Origin，
      # 效果与意图相反 —— 会拒绝所有携带 Origin 的请求（含同源 POST）。
      # 统一部署（Express 同时托管前端与 API）下请填写本站公网域名；
      # 多个域名用英文逗号分隔。留空则仅放行无 Origin 的请求（服务端调用 / 同源 GET）。
      - key: CORS_ORIGIN
        sync: false
      - key: AI_PROVIDER
        value: agnes
      # v11.1：agnes-2.0-flash 已下线（model_not_found），现役全量攻略生成实测
      # agnes-2.5-flash 27.6s / agnes-3.0-flash 62.6s，选 2.5-flash。
      - key: AGNES_MODEL
        value: agnes-2.5-flash
      # v11.1：真实 AI 生成耗时 15-30s，默认 9s 预算/8s 超时会掐断正常生成，
      # 故放宽（死链路的快速失败由熔断机制保证：401/403 一次即熔断）。
      - key: AI_TOTAL_BUDGET_MS
        value: "60000"
      - key: AI_PROVIDER_TIMEOUT_MS
        value: "55000"
      # v11.2 行程地图：腾讯位置服务前端 Key（lbs.qq.com 免费申请，
      # 建议在控制台为 Key 配置 Referer 域名白名单）。未配置时前端地图区块
      # 显示配置引导，不影响攻略其余功能。
      - key: MAP_TENCENT_KEY
        sync: false
      # 以下敏感变量请在 Render 后台手动设置（Environment 标签页）
      - key: AGNES_API_KEY
        sync: false
