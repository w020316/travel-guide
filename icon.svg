<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <!-- 行纪 XING JI 应用图标 -->
    <defs>
        <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FAF7F2"/>
            <stop offset="100%" stop-color="#F2EDE4"/>
        </linearGradient>
        <linearGradient id="accentBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C8553D"/>
            <stop offset="100%" stop-color="#9E3F2C"/>
        </linearGradient>
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
            <feOffset dx="0" dy="6" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.25"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <pattern id="noise" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
            <circle cx="20" cy="30" r="0.5" fill="#1C1A17" opacity="0.04"/>
            <circle cx="70" cy="60" r="0.5" fill="#1C1A17" opacity="0.04"/>
            <circle cx="40" cy="80" r="0.5" fill="#1C1A17" opacity="0.04"/>
        </pattern>
    </defs>

    <!-- 背景：暖米纸渐变 + 噪点纹理 -->
    <rect width="512" height="512" fill="url(#paperBg)"/>
    <rect width="512" height="512" fill="url(#noise)"/>

    <!-- 装饰：左上角细线（杂志风） -->
    <line x1="64" y1="80" x2="120" y2="80" stroke="#C8553D" stroke-width="2" opacity="0.6"/>
    <text x="64" y="72" font-family="'Noto Sans SC', sans-serif" font-size="11" fill="#9A9388" letter-spacing="2">XING JI</text>

    <!-- 主标识：赭红圆角方块 + "行"字 -->
    <g filter="url(#softShadow)" transform="translate(256, 256) rotate(-3) translate(-256, -256)">
        <rect x="128" y="128" width="256" height="256" rx="32" fill="url(#accentBg)"/>
        <text x="256" y="256" font-family="'Noto Serif SC', 'Songti SC', serif"
              font-size="200" font-weight="900" fill="#FAF7F2"
              text-anchor="middle" dominant-baseline="central">行</text>
    </g>

    <!-- 装饰：右下角"纪"字小标 -->
    <text x="448" y="464" font-family="'Noto Serif SC', serif"
          font-size="36" font-weight="700" fill="#1C1A17" opacity="0.85"
          text-anchor="end">纪</text>

    <!-- 装饰：底部细线 -->
    <line x1="64" y1="464" x2="380" y2="464" stroke="#E4DDD1" stroke-width="1"/>
</svg>
